name: Build AdView BD Android App
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'packages.html'
      - '.github/workflows/adview-app-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Prepare AdView BD app
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp packages.html www/packages.html
          npm init -y
          npm install @capacitor/core@7.4.3 @capacitor/cli@7.4.3 @capacitor/android@7.4.3
          npx cap init "AdView BD" "bd.adview.app" --web-dir www
          node -e "const fs=require('fs');const p='capacitor.config.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.server={...(c.server||{}),url:'https://morulibrahim1-hue.github.io/adviewbd-site/index.html',cleartext:false};fs.writeFileSync(p,JSON.stringify(c,null,2));"
          npx cap add android
          node -e "const fs=require('fs');const p='android/app/build.gradle';let s=fs.readFileSync(p,'utf8');if(!/debug\\s*\\{/.test(s)){s=s.replace(/buildTypes\\s*\\{/, \"buildTypes {\\n        debug { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }\");}fs.writeFileSync(p,s);"
          npx cap sync android
      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: adview-bd-android-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
