<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075e50"><title>AdView BD Admin</title>
<style>
:root{font-family:system-ui,"Noto Sans Bengali",sans-serif;color:#18342b;background:#f2f7f4;--g:#087565;--d:#064c43;--line:#dbe7e0}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,var(--d),var(--g));color:#fff;padding:17px 16px}header strong{font-size:21px}header small{display:block;opacity:.8}.wrap{max-width:1100px;margin:auto;padding:16px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:17px;margin:12px 0;box-shadow:0 5px 18px #153f3008}h2{font-size:20px;margin:0 0 8px}.muted{color:#66776f;font-size:13px}.field{margin:12px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}.field input,.field select{width:100%;padding:12px;border:1px solid #cbdad2;border-radius:10px;font:inherit}.btn{border:0;border-radius:10px;background:var(--g);color:white;font-weight:700;padding:11px 14px;font:inherit;cursor:pointer}.btn.alt{background:#e9f3ee;color:var(--d)}.btn.red{background:#a83232}.btn:disabled{opacity:.5}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row .btn{flex:1}.nav{display:flex;gap:8px;overflow:auto;padding:8px 0}.nav button{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:999px;padding:9px 13px}.nav button.active{background:var(--d);color:white}.hidden{display:none!important}.status{padding:11px;border-radius:10px;background:#edf5f0;margin-top:10px;font-size:13px;overflow-wrap:anywhere}.status.err{background:#fff0ef;color:#9b2727}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#f4f8f5;border-radius:12px;padding:13px}.stat b{font-size:23px;display:block}.item{border-top:1px solid var(--line);padding:13px 0}.item:first-child{border-top:0}.item strong{display:block}.item p{font-size:13px;color:#65766e;margin:4px 0 9px;overflow-wrap:anywhere}.item .row{gap:7px}.item .btn{font-size:13px;padding:8px 10px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;border-bottom:1px solid var(--line);padding:9px;white-space:nowrap}.empty{color:#74847d;text-align:center;padding:22px}@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding:10px}.panel{padding:14px}}
</style></head><body>
<header><div class="wrap"><strong>AdView BD — ADMIN</strong><small>নিরাপদ প্রশাসনিক প্যানেল</small></div></header>
<main class="wrap">
<section id="auth" class="panel"><h2>অ্যাডমিন লগইন</h2><p class="muted">শুধু অনুমোদিত অ্যাডমিন অ্যাকাউন্ট প্রবেশ করতে পারবে।</p>
<div class="field"><label>ইমেইল</label><input id="email" type="email" autocomplete="username" placeholder="morulibrahim1@gmail.com"></div>
<div class="field"><label>পাসওয়ার্ড</label><input id="password" type="password" autocomplete="current-password" minlength="8"></div>
<div class="row"><button class="btn" id="login">লগইন</button><button class="btn alt" id="signup">প্রথম অ্যাডমিন অ্যাকাউন্ট তৈরি</button></div><div style="margin-top:10px"><button class="btn alt" id="resend">যাচাইকরণ ইমেইল আবার পাঠান</button></div>
<div id="authmsg" class="status hidden" role="status"></div>
</section>
<section id="app" class="hidden">
<div class="panel"><div class="row" style="justify-content:space-between"><div><h2>অ্যাডমিন ড্যাশবোর্ড</h2><div class="muted" id="who"></div></div><button class="btn alt" id="logout">লগআউট</button></div><div class="stats" id="stats"></div><div id="appmsg" class="status hidden"></div></div>
<nav class="nav" id="nav"></nav><section class="panel" id="content"><div class="empty">লোড হচ্ছে…</div></section>
</section>
<footer class="muted" style="text-align:center;padding:24px">AdView BD · প্রশাসনিক তথ্য সার্ভার থেকে যাচাই করা হয়</footer>
</main>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0/+esm';
const URL='https://kvaelanllixuztefxpcf.supabase.co';
const KEY='sb_publishable_T6TEoxQJdm1sY-eu1qV54g_DOXXGdZ3';
const supabase=createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);let user=null;let current='overview';
const tabs=[['overview','সারাংশ'],['companies','বিজ্ঞাপনদাতা'],['campaigns','ক্যাম্পেইন'],['ads','বিজ্ঞাপন'],['profiles','ব্যবহারকারী'],['withdrawal_requests','উত্তোলন'],['ad_events','ভিউ যাচাই'],['campaign_daily_reports','রিপোর্ট'],['admin_audit_logs','অডিট লগ']];
function msg(id,text,error=false){$(id).textContent=text;$(id).className='status'+(error?' err':'')}
function safe(v){return String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function adminCheck(){const {data:{session}}=await supabase.auth.getSession();if(!session){showAuth();return}const {data:{user:u}}=await supabase.auth.getUser();if(!u){showAuth();return}user=u;
 if(u.email?.toLowerCase()==='morulibrahim1@gmail.com'&&u.app_metadata?.role!=='admin'){
  const {error}=await supabase.functions.invoke('bootstrap-first-admin');if(error){showAuth();msg('authmsg','প্রথম অ্যাডমিন যাচাই হয়নি: '+error.message,true);return}
  await supabase.auth.refreshSession();const {data:{user:refreshed}}=await supabase.auth.getUser();user=refreshed;
 }
 if(user.app_metadata?.role!=='admin'){await supabase.auth.signOut();showAuth();msg('authmsg','এই ইমেইলের অ্যাডমিন অনুমতি নেই।',true);return}
 $('auth').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=user.email+' · Super Admin';renderNav();await loadStats();await openTab(current);
}
function showAuth(){$('auth').classList.remove('hidden');$('app').classList.add('hidden')}
$('login').onclick=async()=>{const {error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){msg('authmsg',error.message,true);return}await adminCheck()};
$('resend').onclick=async()=>{const email=$('email').value.trim();if(email.toLowerCase()!=='morulibrahim1@gmail.com'){msg('authmsg','নির্ধারিত অ্যাডমিন ইমেইল লিখুন।',true);return}const {error}=await supabase.auth.resend({type:'signup',email,options:{emailRedirectTo:window.location.href}});if(error){msg('authmsg','ইমেইল পাঠানো যায়নি: '+error.message,true);return}msg('authmsg','যাচাইকরণ ইমেইল আবার পাঠানো হয়েছে। Gmail-এর Inbox ও Spam ফোল্ডার দেখুন।')};
$('signup').onclick=async()=>{const email=$('email').value.trim();if(email.toLowerCase()!=='morulibrahim1@gmail.com'){msg('authmsg','প্রথম অ্যাডমিনের নির্ধারিত ইমেইল ব্যবহার করুন।',true);return}const password=$('password').value;if(password.length<8){msg('authmsg','কমপক্ষে ৮ অক্ষরের পাসওয়ার্ড দিন।',true);return}const {data,error}=await supabase.auth.signUp({email,password,options:{emailRedirectTo:window.location.href,data:{display_name:'AdView BD Admin'}}});if(error){msg('authmsg',error.message,true);return}if(data.session){await adminCheck()}else msg('authmsg','ইমেইলে Supabase-এর confirmation link পাঠানো হয়েছে। ইমেইল যাচাই করে আবার লগইন করুন।')};
$('logout').onclick=async()=>{await supabase.auth.signOut();showAuth()};
function renderNav(){$('nav').innerHTML=tabs.map(([id,label])=>'<button data-tab="'+id+'">'+label+'</button>').join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>openTab(b.dataset.tab))}
async function loadStats(){const tables=['profiles','companies','campaigns','ads','withdrawal_requests'];const labels=['ব্যবহারকারী','বিজ্ঞাপনদাতা','ক্যাম্পেইন','বিজ্ঞাপন','উত্তোলন'];const vals=await Promise.all(tables.map(async t=>{const {count,error}=await supabase.from(t).select('*',{count:'exact',head:true});return error?'—':count}));$('stats').innerHTML=vals.map((v,i)=>'<div class="stat"><b>'+safe(v)+'</b><span class="muted">'+labels[i]+'</span></div>').join('')}
const config={
 companies:{title:'বিজ্ঞাপনদাতা যাচাই',cols:['name','contact_email','contact_phone','verification_status'],actions:[['approved','অনুমোদন'],['rejected','বাতিল'],['suspended','স্থগিত']],rpc:'admin_review_company',id:'p_company_id'},
 campaigns:{title:'ক্যাম্পেইন ব্যবস্থাপনা',cols:['title','company_id','status','total_budget_bdt','contracted_views'],actions:[['approved','অনুমোদন'],['active','চালু'],['paused','বিরতি'],['rejected','বাতিল']],rpc:'admin_review_campaign',id:'p_campaign_id'},
 ads:{title:'বিজ্ঞাপন ব্যবস্থাপনা',cols:['title','campaign_id','duration_seconds','is_active','media_url'],actions:[['true','চালু'],['false','বন্ধ']],},
 profiles:{title:'ব্যবহারকারী তালিকা',cols:['id','display_name','account_type','created_at']},
 withdrawal_requests:{title:'উত্তোলন অনুরোধ',cols:['user_id','amount_bdt','payout_method','payout_account','status','requested_at'],actions:[['processing','প্রক্রিয়াধীন'],['paid','পরিশোধিত'],['rejected','প্রত্যাখ্যান']],rpc:'admin_review_withdrawal',id:'p_request_id'},
 ad_events:{title:'বিজ্ঞাপন ভিউ যাচাই',cols:['viewer_id','ad_id','campaign_id','event_type','watched_seconds','verification_status','event_at']},
 campaign_daily_reports:{title:'দৈনিক রিপোর্ট',cols:['campaign_id','report_date','starts_count','completed_count','verified_views','suspicious_count','rejected_count']},
 admin_audit_logs:{title:'অ্যাডমিন কার্যক্রম',cols:['action','target_table','target_id','details','created_at']}
};
async function openTab(tab){current=tab;$('nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='overview'){await overview();return}const c=config[tab];$('content').innerHTML='<h2>'+c.title+'</h2><div class="muted">সার্ভার থেকে সর্বশেষ রেকর্ড</div><div id="records" class="empty">লোড হচ্ছে…</div>';let q=supabase.from(tab).select(c.cols.join(',')).order(tab==='withdrawal_requests'?'requested_at':'created_at',{ascending:false}).limit(100);if(tab==='ad_events')q=supabase.from(tab).select(c.cols.join(',')).order('event_at',{ascending:false}).limit(100);if(tab==='campaign_daily_reports')q=supabase.from(tab).select(c.cols.join(',')).order('report_date',{ascending:false}).limit(100);if(tab==='admin_audit_logs')q=supabase.from(tab).select(c.cols.join(',')).order('created_at',{ascending:false}).limit(100);
const {data,error}=await q;if(error){$('records').textContent='তথ্য লোড হয়নি: '+error.message;return}if(!data?.length){$('records').textContent='এখনো কোনো রেকর্ড নেই।';return}
$('records').innerHTML=data.map(row=>'<article class="item"><strong>'+safe(row[c.cols[0]])+'</strong><p>'+c.cols.slice(1).map(k=>'<b>'+safe(k)+':</b> '+safe(row[k])).join('<br>')+'</p>'+(c.actions?'<div class="row">'+c.actions.map(([v,l])=>'<button class="btn '+(v==='rejected'||v==='suspended'?'red':'alt')+'" data-id="'+safe(row.id)+'" data-value="'+v+'">'+l+'</button>').join('')+'</div>':'')+'</article>').join('');
$('records').querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>changeStatus(tab,b.dataset.id,b.dataset.value));
}
async function changeStatus(tab,id,value){if(!confirm('এই পরিবর্তনটি নিশ্চিত করবেন?'))return;const c=config[tab];let error;
if(tab==='ads'){const r=await supabase.from('ads').update({is_active:value==='true'}).eq('id',id);error=r.error}
else{const r=await supabase.rpc(c.rpc,{[c.id]:id,p_status:value,p_note:'Updated from AdView BD Admin'});error=r.error}
if(error){msg('appmsg','পরিবর্তন ব্যর্থ: '+error.message,true);return}msg('appmsg','পরিবর্তন সফল হয়েছে।');await openTab(tab);await loadStats()}
async function overview(){$('content').innerHTML='<h2>সিস্টেম সারাংশ</h2><p class="muted">বাস্তব ডেটাবেস রেকর্ডের ভিত্তিতে হিসাব।</p><div class="status">শুধু যাচাইকৃত বিজ্ঞাপন ভিউ সম্পন্ন হলে আয় গণনা হবে। এই প্যানেল থেকে কোনো ভুয়া ব্যালেন্স বা পেমেন্ট তৈরি করা হয় না।</div><div class="row" style="margin-top:12px"><button class="btn alt" id="refresh">রিফ্রেশ</button></div>'; $('refresh').onclick=async()=>{await loadStats();await overview()}}
await supabase.auth.getSession().then(({data})=>{if(data.session)adminCheck()});
</script></body></html>
